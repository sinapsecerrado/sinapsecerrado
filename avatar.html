<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1000px; height: 1000px; background: #0c120e; }
  .a { width: 1000px; height: 1000px; position: relative; overflow: hidden;
       background: radial-gradient(70% 70% at 30% 25%, rgba(224,170,62,.28), transparent 70%),
                   radial-gradient(60% 60% at 80% 85%, rgba(200,100,59,.30), transparent 70%), #0c120e; }
  svg { position: absolute; inset: 0; }
</style></head>
<body><div class="a">
<svg viewBox="0 0 1000 1000" width="1000" height="1000">

    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3c969"/><stop offset=".55" stop-color="#e0aa3e"/><stop offset="1" stop-color="#c8643b"/>

    <filter id="brilho" x="-50%" y="-50%" width="200%" height="200%">

    </filter>

  <!-- rede de fundo -->

    <circle cx="120" cy="760" r="6"/><circle cx="240" cy="880" r="7"/><circle cx="380" cy="820" r="5"/>
    <circle cx="760" cy="860" r="7"/><circle cx="900" cy="780" r="5"/><circle cx="640" cy="930" r="6"/>
  </g>
  <!-- símbolo: sinapses -->
  <g filter="url(#brilho)" fill="none" stroke="url(#g)" stroke-width="34" stroke-linecap="round">
    <path d="M369 420L457 602M639 378L540 601M413 343L601 326"/>
    <circle cx="335" cy="350" r="78"/>
    <circle cx="665" cy="320" r="64"/>
    <circle cx="500" cy="690" r="98"/>
  </g>
  <circle cx="500" cy="690" r="34" fill="url(#g)"/>
</svg>
</div></body></html>
